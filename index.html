<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berkut Garage | Симулятор Номеров</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Roboto+Condensed:wght@700&display=swap');

        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f5f5f5;
            --text-secondary: #a0a0a0;
            --accent: #d4af37; /* Золотой */
            --accent-hover: #b8962e;
            --success: #2ecc71;
            --danger: #e74c3c;
            --primary: #3498db;
            --plate-font: 'Roboto Condensed', 'Arial Narrow', sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            background-image: radial-gradient(circle at 50% 0%, #2a2a2a 0%, #121212 70%);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(212, 175, 55, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 5px;
        }

        .brand-header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .brand-header p {
            margin: 4px 0 0 0;
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .balance-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
        }

        /* Табы (Генератор / Гараж) */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .tab.active {
            background: var(--accent);
            color: #121212;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Выбор страны и региона */
        .selectors {
            display: flex;
            gap: 10px;
        }

        .selectors select {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            appearance: none;
            text-align: center;
        }

        .selectors select option {
            background: var(--card-bg);
            color: var(--text-main);
        }

        /* Номерной знак */
        .plate-container {
            display: flex;
            justify-content: center;
            margin: 5px 0;
            perspective: 1000px;
            min-height: 80px;
            align-items: center;
        }

        .license-plate {
            display: inline-flex;
            background: #fff;
            border: 4px solid #000;
            border-radius: 6px;
            font-family: var(--plate-font);
            font-weight: bold;
            font-size: 38px;
            line-height: 1;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            user-select: none;
        }

        .license-plate:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.6);
        }

        .license-plate.rare { box-shadow: 0 0 20px rgba(52, 152, 219, 0.5); }
        .license-plate.elite { box-shadow: 0 0 20px rgba(212, 175, 55, 0.6); }
        .license-plate.legendary { box-shadow: 0 0 30px rgba(231, 76, 60, 0.8), 0 0 60px rgba(231, 76, 60, 0.4); animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .plate-main {
            padding: 6px 10px;
            letter-spacing: 2px;
            background: #fff;
            color: #000;
        }

        .plate-region {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 4px 6px;
            background: #fff;
            border-left: 2px solid #000;
            font-size: 18px;
            color: #000;
        }

        .plate-region .region-code {
            font-size: 24px;
            line-height: 1;
        }

        .plate-region .region-text {
            font-size: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 2px;
            margin-top: 2px;
        }

        .flag { width: 14px; height: 9px; background: linear-gradient(to bottom, #fff 33%, #0039a6 33%, #0039a6 66%, #d52b1e 66%); border: 1px solid #ccc; display: inline-block; }

        /* Информация о номере */
        .info-panel {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .info-panel .status {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .status.common { color: var(--text-secondary); }
        .status.rare { color: var(--primary); }
        .status.elite { color: var(--accent); }
        .status.legendary { color: var(--danger); text-transform: uppercase; }

        .price-tag {
            font-size: 18px;
            font-weight: 800;
            color: var(--success);
            margin-top: 4px;
        }

        /* Кнопки */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        .btn-generate {
            background-color: var(--accent);
            color: #121212;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-generate:hover:not(:disabled) { background-color: var(--accent-hover); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5); }

        .btn-action-group { display: flex; gap: 8px; }
        .btn-action-group button { flex: 1; }

        .btn-sell { background-color: transparent; color: var(--success); border: 2px solid var(--success); }
        .btn-sell:hover:not(:disabled) { background-color: var(--success); color: #121212; }

        .btn-keep { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-keep:hover:not(:disabled) { background-color: var(--primary); color: #fff; }

        .cost-info { text-align: center; font-size: 11px; color: var(--text-secondary); margin-top: -5px; }

        /* Гараж */
        .garage-list {
            max-height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .garage-list::-webkit-scrollbar { width: 6px; }
        .garage-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        .garage-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

        .garage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px;
            transition: background 0.2s;
        }

        .garage-item:hover { background: rgba(255,255,255,0.06); }

        .garage-item-info { display: flex; flex-direction: column; gap: 2px; }
        .garage-item-plate { font-family: var(--plate-font); font-size: 20px; font-weight: bold; color: #fff; letter-spacing: 1px; }
        .garage-item-region { font-size: 12px; color: var(--text-secondary); }
        .garage-item-price { font-size: 14px; font-weight: bold; color: var(--success); }

        .garage-item .btn-sell-small {
            padding: 8px 12px;
            font-size: 12px;
            background: rgba(46, 204, 113, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
            border-radius: 6px;
        }
        .garage-item .btn-sell-small:hover { background: var(--success); color: #121212; }

        .empty-garage { text-align: center; color: var(--text-secondary); font-size: 14px; padding: 20px 0; }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--accent);
            color: #121212;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            z-index: 1000;
            text-align: center;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <h1>Berkut Garage</h1>
        <p>Симулятор Номеров</p>
    </div>

    <div class="header">
        <div class="balance-label">Баланс</div>
        <div class="balance"><span id="balance">100 000</span> ₽</div>
    </div>

    <!-- Табы -->
    <div class="tabs">
        <div class="tab active" id="tab-generator" onclick="switchTab('generator')">Генератор</div>
        <div class="tab" id="tab-garage" onclick="switchTab('garage')">Гараж (<span id="garage-count">0</span>)</div>
    </div>

    <!-- Вкладка: Генератор -->
    <div id="view-generator" style="display: flex; flex-direction: column; gap: 12px;">
        <div class="selectors">
            <select id="country-select" onchange="updateRegions()">
                <option value="RU">🇷🇺 Россия</option>
                <!-- Задел на будущее -->
                <!-- <option value="BY">🇧🇾 Беларусь</option> -->
                <!-- <option value="KZ">🇰🇿 Казахстан</option> -->
            </select>
            <select id="region-select">
                <!-- Заполняется через JS -->
            </select>
        </div>

        <div class="plate-container">
            <div class="license-plate" id="plate">
                <div class="plate-main" id="plate-main">A000AA</div>
                <div class="plate-region">
                    <div class="region-code" id="region-code">77</div>
                    <div class="region-text">RUS <span class="flag"></span></div>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <div class="status common" id="status-text">Ожидание генерации</div>
            <div class="price-tag" id="price-text">Стоимость: 0 ₽</div>
        </div>

        <div class="controls">
            <button class="btn-generate" id="btn-generate">Сгенерировать (200 ₽)</button>
            <div class="btn-action-group">
                <button class="btn-sell" id="btn-sell" disabled>Продать</button>
                <button class="btn-keep" id="btn-keep" disabled>В Гараж</button>
            </div>
        </div>
        <div class="cost-info">* Крутые номера на престижных регионах стоят миллионы</div>
    </div>

    <!-- Вкладка: Гараж -->
    <div id="view-garage" style="display: none; flex-direction: column; gap: 10px;">
        <div class="garage-list" id="garage-list">
            <!-- Заполняется через JS -->
        </div>
        <button class="btn-sell" id="btn-sell-all" style="margin-top: 5px;">Продать всё</button>
    </div>
</div>

<div class="toast" id="toast">Текст уведомления</div>

<script>
    // ================= КОНФИГУРАЦИЯ =================
    const CONFIG = {
        startBalance: 100000,
        baseCost: 200, // Цена генерации (пачка чипсов)
        letters: 'ABEKMHOPCTYX',
        eliteLetters: ['AMP', 'EKX', 'AMR', 'KMR', 'OMP', 'MMM', 'XXX', 'KKX'],
        // База данных регионов
        regions: {
            'RU': {
                '77': { name: 'Москва', multiplier: 5 },
                '99': { name: 'Москва', multiplier: 8 },
                '97': { name: 'Москва', multiplier: 12 },
                '177': { name: 'Москва', multiplier: 4 },
                '199': { name: 'Москва', multiplier: 6 },
                '197': { name: 'Москва', multiplier: 7 },
                '78': { name: 'СПб', multiplier: 4 },
                '98': { name: 'СПб', multiplier: 5 },
                '178': { name: 'СПб', multiplier: 3 },
                '198': { name: 'СПб', multiplier: 4 },
                '23': { name: 'Краснодар', multiplier: 3 },
                '93': { name: 'Краснодар', multiplier: 4 },
                '123': { name: 'Краснодар', multiplier: 5 },
                '01': { name: 'Адыгея', multiplier: 1 },
                '02': { name: 'Башкортостан', multiplier: 1.5 },
                '66': { name: 'Свердловская', multiplier: 2 },
                '799': { name: 'Москва', multiplier: 6 }
            }
        }
    };

    // ================= СОСТОЯНИЕ ИГРЫ =================
    let state = {
        balance: CONFIG.startBalance,
        currentPlate: null,
        garage: [],
        selectedCountry: 'RU',
        selectedRegion: '77'
    };

    // ================= DOM ЭЛЕМЕНТЫ =================
    const balanceEl = document.getElementById('balance');
    const plateMainEl = document.getElementById('plate-main');
    const regionCodeEl = document.getElementById('region-code');
    const statusTextEl = document.getElementById('status-text');
    const priceTextEl = document.getElementById('price-text');
    const btnGenerate = document.getElementById('btn-generate');
    const btnSell = document.getElementById('btn-sell');
    const btnKeep = document.getElementById('btn-keep');
    const plateEl = document.getElementById('plate');
    const toastEl = document.getElementById('toast');
    
    const countrySelect = document.getElementById('country-select');
    const regionSelect = document.getElementById('region-select');
    const garageListEl = document.getElementById('garage-list');
    const garageCountEl = document.getElementById('garage-count');
    const btnSellAll = document.getElementById('btn-sell-all');

    // ================= ЛОГИКА СОХРАНЕНИЯ =================
    function saveGame() {
        localStorage.setItem('berkutGarageSave_v2', JSON.stringify(state));
    }

    function loadGame() {
        const saved = localStorage.getItem('berkutGarageSave_v2');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
            } catch (e) {
                console.error("Ошибка загрузки", e);
            }
        }
        updateRegions(); // Заполняем выпадающий список регионов
        updateUI();
    }

    // ================= УПРАВЛЕНИЕ ИНТЕРФЕЙСОМ =================
    function switchTab(tab) {
        document.getElementById('tab-generator').classList.toggle('active', tab === 'generator');
        document.getElementById('tab-garage').classList.toggle('active', tab === 'garage');
        
        document.getElementById('view-generator').style.display = tab === 'generator' ? 'flex' : 'none';
        document.getElementById('view-garage').style.display = tab === 'garage' ? 'flex' : 'none';
        
        if (tab === 'garage') renderGarage();
    }

    function updateRegions() {
        const country = countrySelect.value;
        state.selectedCountry = country;
        const regions = CONFIG.regions[country];
        
        regionSelect.innerHTML = '';
        for (const [code, data] of Object.entries(regions)) {
            const option = document.createElement('option');
            option.value = code;
            option.textContent = `${data.name} (${code})`;
            regionSelect.appendChild(option);
        }
        
        // Восстанавливаем выбранный регион, если он есть в списке
        if (regions[state.selectedRegion]) {
            regionSelect.value = state.selectedRegion;
        } else {
            state.selectedRegion = Object.keys(regions)[0];
            regionSelect.value = state.selectedRegion;
        }
        
        saveGame();
        updateUI();
    }

    regionSelect.addEventListener('change', (e) => {
        state.selectedRegion = e.target.value;
        saveGame();
        updateUI();
    });

    // ================= ГЕНЕРАЦИЯ И ЦЕНООБРАЗОВАНИЕ =================
    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function formatMoney(amount) {
        return amount.toLocaleString('ru-RU');
    }

    function calculatePlate() {
        const letter = () => CONFIG.letters[getRandomInt(0, CONFIG.letters.length - 1)];
        const digit = () => getRandomInt(0, 9);
        
        const plateStr = `${letter()}${digit()}${digit()}${digit()}${letter()}${letter()}`;
        const regionCode = state.selectedRegion;
        
        // Разбор номера
        const lettersPart = plateStr[0] + plateStr[4] + plateStr[5]; // Например, AMP
        const numbersPart = plateStr.substring(1, 4); // Например, 001

        // Определение редкости
        let rarity = 'common';
        let statusText = 'Обычный';
        let multiplier = 1;

        // 1. Множитель букв
        if (CONFIG.eliteLetters.includes(lettersPart)) {
            rarity = 'legendary';
            statusText = 'ЭЛИТНЫЙ (Блат)';
            multiplier *= 100; // АМР, ЕКХ и т.д. очень дорогие
        } else if (lettersPart[0] === lettersPart[1] && lettersPart[1] === lettersPart[2]) {
            rarity = 'elite';
            statusText = 'Красивые буквы (ААА)';
            multiplier *= 15;
        } else if (lettersPart[0] === lettersPart[1] || lettersPart[1] === lettersPart[2]) {
            rarity = 'rare';
            statusText = 'Необычные буквы (2 одинаковые)';
            multiplier *= 3;
        }

        // 2. Множитель цифр
        if (numbersPart === '001' || numbersPart === '777' || numbersPart === '999') {
            if (rarity === 'legendary') { statusText = 'ЛЕГЕНДА (Блат + Цифры)'; multiplier *= 50; }
            else { rarity = 'legendary'; statusText = 'ЛЕГЕНДАРНЫЙ (Цифры)'; multiplier *= 30; }
        } else if (numbersPart === '002' || numbersPart === '003' || numbersPart === '123' || numbersPart === '111' || numbersPart === '888') {
            if (rarity === 'common') { rarity = 'rare'; statusText = 'Красивые цифры'; }
            multiplier *= 5;
        } else if (numbersPart === '000') {
            multiplier *= 0.5; // Штраф за 000 (считается плохим)
            statusText = 'Обычный (000)';
        }

        // 3. Множитель региона
        const regionData = CONFIG.regions[state.selectedCountry][regionCode];
        const regionMultiplier = regionData ? regionData.multiplier : 1;
        multiplier *= regionMultiplier;

        // Итоговая цена
        const basePrice = 500; // Базовая цена "среднего" номера
        let sellPrice = Math.round(basePrice * multiplier * (0.8 + Math.random() * 0.4));
        
        // Минимальная цена (чтобы не продавать за копейки)
        if (sellPrice < 50) sellPrice = 50;

        // Переопределяем редкость для интерфейса, если номер оказался очень дорогим из-за региона
        if (sellPrice > 100000 && rarity !== 'legendary') {
            rarity = 'elite';
            statusText = 'Дорогой регион';
        }

        return {
            id: Date.now() + Math.random().toString(36).substr(2, 5),
            number: plateStr,
            region: regionCode,
            country: state.selectedCountry,
            rarity: rarity,
            statusText: statusText,
            sellPrice: sellPrice,
            multiplier: multiplier
        };
    }

    // ================= ОБНОВЛЕНИЕ UI =================
    function updateUI() {
        balanceEl.textContent = formatMoney(state.balance);

        if (state.currentPlate) {
            plateMainEl.textContent = state.currentPlate.number;
            regionCodeEl.textContent = state.currentPlate.region;
            
            statusTextEl.textContent = state.currentPlate.statusText;
            statusTextEl.className = `status ${state.currentPlate.rarity}`;
            
            priceTextEl.textContent = `Стоимость: ${formatMoney(state.currentPlate.sellPrice)} ₽`;
            
            plateEl.className = `license-plate ${state.currentPlate.rarity}`;
            
            btnSell.disabled = false;
            btnKeep.disabled = false;
        } else {
            plateMainEl.textContent = 'A000AA';
            regionCodeEl.textContent = state.selectedRegion;
            statusTextEl.textContent = 'Ожидание генерации';
            statusTextEl.className = 'status common';
            priceTextEl.textContent = 'Стоимость: 0 ₽';
            plateEl.className = 'license-plate';
            btnSell.disabled = true;
            btnKeep.disabled = true;
        }

        // Блокировка кнопки генерации
        if (state.balance < CONFIG.baseCost) {
            btnGenerate.disabled = true;
            btnGenerate.textContent = 'Недостаточно средств';
        } else {
            btnGenerate.disabled = false;
            btnGenerate.textContent = `Сгенерировать (${formatMoney(CONFIG.baseCost)} ₽)`;
        }
        
        garageCountEl.textContent = state.garage.length;
    }

    // ================= ГАРАЖ =================
    function renderGarage() {
        garageListEl.innerHTML = '';
        
        if (state.garage.length === 0) {
            garageListEl.innerHTML = '<div class="empty-garage">Гараж пуст.<br>Сгенерируйте и сохраните номера!</div>';
            btnSellAll.disabled = true;
            return;
        }
        
        btnSellAll.disabled = false;
        
        // Сортируем по цене (от дорогих к дешевым)
        const sortedGarage = [...state.garage].sort((a, b) => b.sellPrice - a.sellPrice);
        
        sortedGarage.forEach(plate => {
            const item = document.createElement('div');
            item.className = 'garage-item';
            
            item.innerHTML = `
                <div class="garage-item-info">
                    <div class="garage-item-plate">${plate.number} <span style="font-size: 12px; color: #aaa;">${plate.region}</span></div>
                    <div class="garage-item-region">${plate.statusText}</div>
                    <div class="garage-item-price">${formatMoney(plate.sellPrice)} ₽</div>
                </div>
                <button class="btn-sell-small" onclick="sellFromGarage('${plate.id}')">Продать</button>
            `;
            
            garageListEl.appendChild(item);
        });
    }

    function sellFromGarage(id) {
        const index = state.garage.findIndex(p => p.id === id);
        if (index !== -1) {
            const price = state.garage[index].sellPrice;
            state.balance += price;
            state.garage.splice(index, 1);
            showToast(`Продано за ${formatMoney(price)} ₽`);
            saveGame();
            updateUI();
            renderGarage();
        }
    }

    function sellAll() {
        if (state.garage.length === 0) return;
        
        let total = 0;
        state.garage.forEach(p => total += p.sellPrice);
        
        state.balance += total;
        state.garage = [];
        
        showToast(`Всё продано за ${formatMoney(total)} ₽`);
        saveGame();
        updateUI();
        renderGarage();
    }

    // ================= ОБРАБОТЧИКИ СОБЫТИЙ =================
    btnGenerate.addEventListener('click', () => {
        if (state.balance < CONFIG.baseCost) return;

        state.balance -= CONFIG.baseCost;
        
        const newPlate = calculatePlate();
        state.currentPlate = newPlate;

        updateUI();
        saveGame();
        
        showToast(`Выпал номер: ${newPlate.number} ${newPlate.region}`);
    });

    btnSell.addEventListener('click', () => {
        if (!state.currentPlate) return;

        const price = state.currentPlate.sellPrice;
        state.balance += price;
        
        showToast(`Продано за ${formatMoney(price)} ₽`);
        
        state.currentPlate = null;
        updateUI();
        saveGame();
    });

    btnKeep.addEventListener('click', () => {
        if (!state.currentPlate) return;
        
        state.garage.push(state.currentPlate);
        showToast(`Номер ${state.currentPlate.number} добавлен в гараж`);
        
        state.currentPlate = null;
        updateUI();
        saveGame();
    });

    btnSellAll.addEventListener('click', sellAll);

    // ================= УВЕДОМЛЕНИЯ =================
    function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        setTimeout(() => {
            toastEl.classList.remove('show');
        }, 2500);
    }

    // ================= ИНИЦИАЛИЗАЦИЯ =================
    loadGame();
</script>

</body>
</html>
